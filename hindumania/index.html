<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HinduMania</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/logo.png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9933, #ffffff, #138808);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
    }

    .logo {
      width: 100px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      color: #ff6600;
      margin-bottom: 10px;
    }

    p {
      color: #333;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      margin: 10px;
      border-radius: 30px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .btn-primary {
      background: #ff6600;
    }

    .btn-secondary {
      background: #138808;
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="hindu.png" alt="HinduMania Logo" class="logo" />

    <h1>HinduMania</h1>
    <p>Your gateway to spiritual knowledge, books, audio, and videos.</p>

    <a href="#" class="btn btn-primary">Explore Books</a>
    <a href="#" class="btn btn-secondary">Listen Audio</a>

    <footer>
      © 2026 HinduMania. All rights reserved.
    </footer>
  </div>
</body>
</html>
