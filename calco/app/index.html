<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by the `--base-href` argument of `flutter build`
    (for example /calco/app/ when served from a sub-folder).
  -->
  <base href="/calco/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calco: a fast calculator that double-checks your sums, plus currency and unit converter, GST, EMI, gold rates, notes with khata, and 60+ everyday tools. Works offline once loaded.">
  <meta name="theme-color" content="#5B52E6">

  <!-- Installed on a phone's home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calco">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Calco: Calculator &amp; Tools</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the app downloads; removed on its first frame. */
    html, body { margin: 0; height: 100%; background: #5B52E6; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff; transition: opacity .3s;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    #loading span { font-size: 15px; opacity: .85; letter-spacing: .3px; }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Loading Calco…</span>
  </div>
  <noscript>Calco needs JavaScript to run.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
