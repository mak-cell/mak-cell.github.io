plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.makcell.sdvgoalboard'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.makcell.sdvgoalboard'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // personal sideloaded app: signed with this PC's debug key so updates install over the old version
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
